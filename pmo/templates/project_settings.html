{% extends "base.html" %}
{% block content %}
<div class="page-head"><h1>{{ project.name }} · 설정</h1>
  <a class="btn" href="{{ url_for('project_detail', project_id=project.id) }}">← 프로젝트</a></div>

<section class="card">
  <h2>멤버 <span class="muted">{{ members|length }}명</span></h2>
  <table class="table">
    <thead><tr><th>이름</th><th>소속</th><th>역할</th><th></th></tr></thead>
    <tbody>
    {% for m in members %}
      <tr>
        <td><b>{{ m.name }}</b><br><small class="muted">{{ m.email }}</small></td>
        <td>{{ m.org or '-' }}</td>
        <td>
          <form method="post" action="{{ url_for('member_role', project_id=project.id, user_id=m.id) }}">
            <select name="role" onchange="this.form.submit()">
              {% for r in roles %}<option value="{{ r }}" {{ 'selected' if r == m.role }}>{{ ROLE_LABELS[r] }}</option>{% endfor %}
            </select>
          </form>
        </td>
        <td class="right">
          <form method="post" action="{{ url_for('member_remove', project_id=project.id, user_id=m.id) }}"
                onsubmit="return confirm('{{ m.name }}님을 제거할까요? 즉시 프로젝트를 볼 수 없고 알림도 중단됩니다.')">
            <button class="btn danger">제거</button></form>
        </td>
      </tr>
    {% endfor %}
    </tbody>
  </table>

  {% if candidates %}
  <form method="post" action="{{ url_for('member_add', project_id=project.id) }}" class="add-member">
    <select name="user_id" required>
      <option value="">추가할 사람 선택</option>
      {% for u in candidates %}<option value="{{ u.id }}">{{ u.name }} ({{ u.org }})</option>{% endfor %}
    </select>
    <select name="role">{% for r in roles %}<option value="{{ r }}" {{ 'selected' if r == 'member' }}>{{ ROLE_LABELS[r] }}</option>{% endfor %}</select>
    <button class="btn primary">추가</button>
  </form>
  {% endif %}
  <p class="muted small">추가한 사람은 그 시점부터 프로젝트를 볼 수 있고 알림을 받습니다. 제거하면 즉시 중단됩니다.</p>
</section>
{% endblock %}
